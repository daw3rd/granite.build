name: sky-slurm-bluevela
type: Skypilot
subtype: slurm
config:
  default_cloud: slurm
  # Autostop is intentionally 0/ignored: SLURM does not support cluster
  # autostop, so gbserver forces autostop=None for the slurm cloud. Per-step
  # `sky down` releases the node allocation after each step.
  idle_minutes_to_autostop: 0
  # The SSH `Host` alias below must match this; SkyPilot provisions on
  # infra=slurm/bluevela (composed by skypilot.py from cluster + zone).
  cluster: bluevela
  # SkyPilot's `zone` is overloaded per-cloud: for the slurm backend it maps to
  # the SLURM partition (submitted via `--partition`). gbserver folds this into
  # the infra string as slurm/bluevela/gpu-mid. Override per-step/build by
  # setting `zone` in step.yaml or build.yaml config; omit it entirely to let
  # SLURM pick the cluster's default partition.
  zone: gpu-mid
  # Env-level shared filesystem root for per-run build workdirs. gbserver derives
  # ${shared_workdir}/builds/<build_id>/runs/<targetrun_id>/ from this, exports it
  # as GB_BUILD_WORKDIR, and makes it the CWD of both the setup and run scripts.
  # Reuses the LSF BlueVela shared /proj path (same cluster filesystem).
  shared_workdir: /proj/data-eng/llmb-read-write/builds/
  # Clear SkyPilot's persisted SSH ControlMaster sockets before each idle launch
  # of this cloud so a re-keyed cluster_ssh_config re-authenticates instead of
  # silently reusing a stale connection. 
  reset_ssh_on_idle_launch: true 
  # Inline SLURM cluster SSH reachability. gbserver materializes this into
  # ~/.slurm/config at launch so SkyPilot's SLURM provisioner can reach the login
  # node and enumerate partitions/nodes. Keys are the exact OpenSSH directive
  # names (mirrors ~/.slurm/config 1:1). Each value is secret-name-or-literal.
  # Reuses the LSF BlueVela credentials/key; only HostName differs (login1, the
  # SLURM login node, vs login4 for LSF). Use `IdentityKey: BV_SSH_PRIVATE_KEY`
  # (a secret) instead of IdentityFile for CI/CD where no key is on the host.
  #
  # NOTE: SkyPilot reuses a persisted SSH ControlMaster socket keyed on
  # (host, port, user) — NOT the key — so switching the IdentityFile/IdentityKey
  # below can be masked by a stale connection for the ControlPersist window. The
  # `reset_ssh_on_idle_launch: true` above makes gbserver clear those sockets on
  # each idle launch so the changed config re-authenticates (also what lets the
  # slurm_bluevela 1-step live test validate the currently materialized key).
  cluster_ssh_configs:
    slurm:
      - Host: bluevela
        HostName: login1.bluevela.rmf.ibm.com
        User: granitebuild
        # Set reset_ssh_on_idle_launch true above when testing modified credentials. 
        IdentityFile: ~/.ssh/ibm-bluevela.key
        #IdentityFile: ~/.ssh/cogops_bv.key
        #IdentityKey: BV_SSH_PRIVATE_KEY
        IdentitiesOnly: "yes"
assetstores:
  - store_uri: space://assetstores/hf
    pull:
      - mode: default
        config:
          cache_path: /tmp/hf_cache
    push:
      - mode: default
        config: {}
